program: src.experiments
method: bayes
metric:
  name: dev/mrr
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 4
  eta: 2
command:
  - ${env}
  - python
  - -m
  - src.experiments
  - --train
  - --wandb
  - --wandb_project
  - rs-nlp-conve-kinship
  - --wandb_group
  - kinshiphinton_latest-rs-nlp-final
  - --wandb_tags
  - point.rs.conve,kinshiphinton_latest,nlp,micro-sweep
  - --data_dir
  - data/KinshipHintonLatest
  - --model
  - point.rs.conve
  - --add_reversed_training_edges
  - --group_examples_by_query
  - --use_question_encoder
  - --use_action_space_bucketing
  - --bert_model_name
  - bert-base-uncased
  - --cached_qa_metadata_path
  - ./.cache/kinshiphinton_latest/kinshiphinton_clean.json
  - --raw_QAData_path
  - data/KinshipHintonLatest/kinship_qa_nhop.csv
  - --max_question_len
  - "100"
  - --conve_state_dict_path
  - model/KinshipHintonLatest-conve-RV-xavier-36-36-0.01-8-2-0.1-0.1-0.2-0.05/checkpoint-50.tar
  - --distmult_state_dict_path
  - model/KinshipHintonLatest-conve-RV-xavier-36-36-0.01-8-2-0.1-0.1-0.2-0.05/checkpoint-50.tar
  - --complex_state_dict_path
  - model/KinshipHintonLatest-conve-RV-xavier-36-36-0.01-8-2-0.1-0.1-0.2-0.05/checkpoint-50.tar
  - --entity_dim
  - "36"
  - --relation_dim
  - "36"
  - --emb_2D_d1
  - "6"
  - --emb_2D_d2
  - "6"
  - --num_out_channels
  - "8"
  - --kernel_size
  - "2"
  - --num_rollout_steps
  - "3"
  - --history_dim
  - "64"
  - --history_num_layers
  - "2"
  - --bucket_interval
  - "10"
  - --num_epochs
  - "60"
  - --num_wait_epochs
  - "12"
  - --num_peek_epochs
  - "1"
  - --batch_size
  - "16"
  - --train_batch_size
  - "8"
  - --dev_batch_size
  - "32"
  - --grad_norm
  - "0"
  - --baseline
  - n/a
  - --action_dropout_anneal_interval
  - "1000"
  - --beam_size
  - "32"
  - --num_paths_per_entity
  - "-1"
  - --margin
  - "0.5"
  - --gpu
  - "0"
  - ${args}
parameters:
  learning_rate:
    values: [0.0003, 0.001, 0.003, 0.01]
  num_rollouts:
    values: [4, 8, 16, 32]
  bandwidth:
    values: [25, 50, 100]
  action_dropout_rate:
    values: [0.0, 0.1, 0.3, 0.5]
  ff_dropout_rate:
    values: [0.0, 0.1, 0.2]
  emb_dropout_rate:
    values: [0.0, 0.1, 0.2]
  beta:
    values: [0.0, 0.01, 0.02, 0.05]
  mu:
    values: [0.25, 0.5, 1.0]
  reward_shaping_threshold:
    values: [0.0, 0.05, 0.1]
  train_batch_size:
    values: [4, 8, 16]
